<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Engine</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside>
  <h1>Style Engine</h1>
  <form id="upload"><label class="drop" id="drop">Drop a .pptx or .html deck<br><small>or click to choose</small>
    <input type="file" id="file" accept=".pptx,.html,.htm" hidden></label></form>
  <div id="upstatus" class="muted"></div>
  <h2>Profiles</h2><ul id="profiles"></ul>
</aside>
<main id="main"><p class="muted">Upload a deck to extract its style, or pick a profile.</p></main>
<script src="/app.js"></script>
</body></html>
