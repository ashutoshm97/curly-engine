name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: go test -race -count=1 ./...
      - name: build
        run: go build -o bin/styleengine ./cmd/styleengine

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t styleengine:ci .
      - name: smoke test
        run: |
          docker run -d --name se -p 8080:8080 styleengine:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS -F file=@testdata/nimbus.html localhost:8080/api/uploads
          sleep 5
          curl -fsS localhost:8080/api/profiles | grep -q '"sourceType":"html"' || { docker logs se; exit 1; }
